name: Update underrated repos report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run report:underrated
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.SUPERSTARS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit report
        run: |
          if git diff --quiet -- "Underrated repos noticed by Superstars.md"; then
            echo "No report changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Underrated repos noticed by Superstars.md"
          git commit -m "Update underrated repos report"
          git push
